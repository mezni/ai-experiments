[project]
name = "04-rag-telco-v1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pillow>=12.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "reportlab>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.uv]
package = false

[project.scripts]
04-rag-telco-v1 = "04_rag_telco_v1:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120
