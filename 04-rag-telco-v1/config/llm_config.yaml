providers:
  openrouter:
    type: openrouter

  openai:
    type: openai

models:
  generation:
    provider: openrouter
    model: minimax/minimax-m3
    temperature: 0.2
    max_tokens: 1000

  embedding:
    provider: openai
    model: text-embedding-3-small

rag:
  top_k: 5
  similarity_threshold: 0.70