[project]
name = "03-rag-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15,<2",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "rank-bm25>=0.2.2,<1",
]

[project.scripts]
03-rag-tests = "03_rag_tests:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that call live third-party APIs (require RUN_INTEGRATION=1)",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
