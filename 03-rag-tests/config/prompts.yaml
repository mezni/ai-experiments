prompts:
  retrieval_query:
    default_version: v2
    user_template: |-
      CONTEXT:
      {context}

      QUESTION:
      {query}
    versions:
      v1:
        system: >-
          You answer questions using only the provided context. If the answer
          cannot be found in the context, say that you don't have enough
          information.
      v2:
        system: >-
          You are a grounded customer-support assistant. Answer using only the
          provided context. Be concise and specific, quoting thresholds, prices,
          and windows where the context states them. If the context does not
          contain the answer, say that you don't have enough information.

  generation_eval:
    default_version: v1
    user_template: |-
      QUESTION:
      {question}

      REFERENCE ANSWER:
      {expected_answer}

      MODEL ANSWER:
      {answer}

      RETRIEVED CONTEXT:
      {context}
    versions:
      v1:
        system: >-
          You are an impartial evaluator of a RAG assistant. Score the model
          answer on three axes using only the retrieved context and reference
          answer. Return ONLY a JSON object with no extra text:
          {"correctness": <0.0 to 1.0>, "grounded": <true|false>,
          "hallucinated": <true|false>}.
          - correctness: how well the model answer matches the reference answer.
          - grounded: true only if every claim in the model answer is supported
            by the retrieved context.
          - hallucinated: true if the model answer states facts not present in
            the retrieved context.