[project]
name = "rag-dataops"
version = "0.1.0"
description = "DataOps for RAG: ingestion, document hashing/metadata/lineage, index versioning, embedding reproducibility, retrieval (LlamaIndex + ChromaDB)"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=1.1.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-openai>=0.7.0",
    "llama-index-vector-stores-chroma>=0.6.0",
    "openai>=3.9.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.2.3",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.6",
    "streamlit>=1.40.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501"]
"app/**/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
