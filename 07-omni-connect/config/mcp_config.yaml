# MCP (Model Context Protocol) Configuration
# Defines the ONE enterprise capability exposed via MCP for omni-connect
# (mirrors the bootcamp config/mcp_config.yaml.txt choice to show one clean
# example of the protocol, not a full tool migration).
#
# Note: src/mcp/mcp_server.py / src/mcp/mcp_client.py are not implemented in
# this repo yet - this file declares the intended shape for that future
# module.

server:
  name: "omni-connect-retail-copilot-mcp"
  # Transport used by the client to launch/connect to the server.
  # "stdio" runs the server as a local subprocess - no network/paid API
  # involved, safe to exercise offline.
  transport: "stdio"
  module: "src.mcp.mcp_server"

# Illustrative/documentation only - mirrors what mcp_server.py would register
# with FastMCP via its own docstring and @mcp_app.tool() decorator (which is
# the actual source of truth FastMCP uses at runtime). Not read by any
# module; kept here so the tool's declared shape is visible without reading
# code. The tool would call src/services/customer_service.get_customer().
tools:
  get_customer_profile:
    description: "Look up a customer's retail profile (plan, device, billing, eligibility, tenure) by customer_id."
    input_schema:
      customer_id: "string, required - e.g. CUST-1001"

# Illustrative only - not currently enforced by src/mcp/mcp_client.py's
# TODO implementation (a production version would wrap the
# session.call_tool() await in asyncio.wait_for(..., timeout=this value)).
# Documented here as the intended timeout for a future hardening pass.
client:
  call_timeout_seconds: 15