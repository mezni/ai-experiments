# Omni-Connect Retail Copilot - container orchestration. See Dockerfile.
services:
  omni-connect-retail-copilot:
    build: .
    image: omni-connect-retail-copilot:local
    container_name: omni-connect-retail-copilot
    ports:
      # Host 8502 -> container 8501, so the containerized portal doesn't
      # collide with a local `streamlit run` (which uses 8501) during the lab.
      - "8502:8501"
    env_file:
      - .env
    volumes:
      # Mount data/ read-write so the mock business-data JSON files and the
      # RAG index (data/kb_store/) can be inspected/edited without rebuilding
      # the image during the lab.
      - ./data:/app/data
    restart: unless-stopped