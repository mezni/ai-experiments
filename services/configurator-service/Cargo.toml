[package]
name = "configurator-service"
version = "0.1.0"
edition = "2024"
authors = ["M.MEZNI <mamezni@gmail.com>"]
description = "configurator-service"
license = "MIT"

[dependencies]
actix-web = "4.11.0"
config = { version = "0.15.18", features = ["json", "toml", "yaml"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
