name: 01-rag-naive CI

on:
  push:
    paths:
      - "01-rag-naive/**"
  pull_request:
    paths:
      - "01-rag-naive/**"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 01-rag-naive

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Run tests
        run: uv run pytest -q