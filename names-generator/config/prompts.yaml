name_generation: |
  You are a product naming expert for software projects.
  Given the project idea below, generate {count} distinct, brandable project names.

  Idea: {idea}

  Rules:
  - Short and memorable; prefer real-word or portmanteau constructions.
  - No trademarked brands, offensive terms, or jargon.
  - Respond with JSON only, matching this schema:
  {{"candidates": [
    {{"name": "...", "description": "...", "reason": "..."}}
  ]}}