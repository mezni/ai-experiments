[project]
name = "blueprint"
version = "0.1.0"
description = "Catalyst: converts raw application ideas into schema-validated execution blueprints"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0,<3.0",
    "openai>=1.0,<2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
ui = [
    "streamlit>=1.63.0",
]

[project.scripts]
catalyst = "app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["app", "llm", "utils", "agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
