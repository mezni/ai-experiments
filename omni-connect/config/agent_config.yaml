# Agent Workflow Configuration
# Omni-Connect Retail Copilot - Coordinator/specialist-agent settings.
# Mirrors the bootcamp config/agent_config.yaml.txt pattern, adapted to the
# omni-connect specialist set (customer_profile, promotion_evaluator,
# policy_retriever).

# Illustrative only - identifies this workflow for humans reading the
# config; not currently read by any module.
workflow:
  name: "retail_copilot_workflow"
  version: "1.0.0"

# The fixed, linear plan sequence (not a dynamic/branching planner).
# Mirrors the default plan produced by AgentCoordinator.build_plan() in
# src/core/agent_coordinator.py (which currently reads no config; keep in
# sync if it is later wired to this file).
planner:
  sequence:
    - customer_profile
    - promotion_evaluator
    - policy_retriever

# Illustrative/documentation only - NOT read by src/core/agent_coordinator.py
# (its self.steps registry is built directly in code against the same
# names). Kept here so the expected step names are declared in one
# human-readable place alongside planner.sequence above.
coordination:
  step_names:
    - customer_profile
    - promotion_evaluator
    - policy_retriever

# Promotion Evaluator Agent rules (mirrors the constants in
# src/agents/promotion_evaluator_agent.py, which are the values actually used).
promotion_evaluator:
  offer_cap_per_interaction: 2
  win_back_exclusive_promo: "PROMO-0005"

# Policy Retriever Agent RAG settings (mirrors the persisted index location
# and retrieval defaults used by src/agents/policy_retriever_agent.py).
policy_retriever:
  index_path: "data/kb_store/vector_index"
  corpus_path: "data/knowledge_base"
  top_k: 8
  similarity_threshold: 0.0

# Workflow validation - documents the result keys the coordinator aggregates.
validation:
  required_result_fields:
    - customer_profile
    - promotion_evaluator
    - policy_retriever

# Illustrative only - shows the shape a real enterprise config would have
# for workflow-level logging controls. Not currently read by any module;
# src/utils/logger.py's setup_logger() takes its level as a direct argument
# instead (same pattern as BC1/BC2).
logging:
  level: "INFO"
  log_plan_steps: true