version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  tyk-dashboard:
    image: tykio/tyk-dashboard:v5.3.12
    container_name: tyk-dashboard
    depends_on:
      - mongo
      - redis
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Listening port
      TYK_DB_BINDADDR: "0.0.0.0:3000"

      # Required storage for Dashboard
      TYK_DB_STORAGE_MAIN_TYPE: "mongo"
      TYK_DB_STORAGE_MAIN_HOST: "mongo"
      TYK_DB_STORAGE_MAIN_PORT: "27017"

      # Redis (optional, for gateway storage)
      TYK_DB_REDIS_URL: "redis://redis:6379"

      # Secrets
      TYK_DB_SECRET: "testsecret"
      TYK_DB_LICENSEKEY: ""

      # Admin user for initial login
      TYK_DB_ADMINUSER_EMAIL: "admin@example.com"
      TYK_DB_ADMINUSER_PASSWORD: "admin123"
      TYK_DB_ADMINUSER_FIRSTNAME: "Admin"
      TYK_DB_ADMINUSER_LASTNAME: "User"

  tyk-gateway:
    image: tykio/tyk-gateway:v5.3.12
    container_name: tyk-gateway
    depends_on:
      - redis
      - tyk-dashboard
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Gateway port and secrets
      TYK_GW_LISTENPORT: "8080"
      TYK_GW_SECRET: "testsecret"
      TYK_GW_NODESECRET: "testsecret"

      # Redis storage
      TYK_GW_STORAGE_TYPE: "redis"
      TYK_GW_STORAGE_HOST: "redis"
      TYK_GW_STORAGE_PORT: "6379"

      # Connect gateway → dashboard
      TYK_GW_DASHBOARD: "true"
      TYK_GW_DASHBOARD_HOST: "http://tyk-dashboard:3000"
      TYK_GW_DASHBOARDUSER: "admin@example.com"
      TYK_GW_DASHBOARDPASS: "admin123"
      TYK_GW_ORGID: "default"

volumes:
  mongo_data:
