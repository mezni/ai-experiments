events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:5100;
    }

    upstream locator_service {
        server locator-service:5800;
    }

    server {
        listen 80;
        server_name localhost;

        # ========== OPENAPI SPEC PATHS ==========
        
        # Redirect root OpenAPI spec requests to the correct service
        location /api-doc/openapi.json {
            # Redirect to auth service's OpenAPI spec
            return 302 /auth/api-doc/openapi.json;
        }

        location /api-docs/openapi.json {
            # Redirect to locator service's OpenAPI spec  
            return 302 /locator/api-docs/openapi.json;
        }

        # Auth Service OpenAPI spec
        location /auth/api-doc/openapi.json {
            proxy_pass http://auth_service/api-doc/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Locator Service OpenAPI spec
        location /locator/api-docs/openapi.json {
            proxy_pass http://locator_service/api-docs/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ========== ABSOLUTE API PATHS (for Swagger UI) ==========
        
        # Auth Service API
        location /api/v1/ {
            proxy_pass http://auth_service/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Locator Service API
        location /api/stations/ {
            proxy_pass http://locator_service/api/stations/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
            
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # ========== PREFIXED PATHS (for direct access) ==========
        
        # Auth Service UI and other pages
        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Locator Service UI and other pages
        location /locator/ {
            proxy_pass http://locator_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect roots to Swagger UI
        location = /auth {
            return 302 /auth/swagger-ui/;
        }

        location = /locator {
            return 302 /locator/swagger-ui/;
        }
    }
}