[package]
name = "configurator-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
thiserror = "2.0.17"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
async-trait = "0.1.89"
config = "0.15.18"
dotenvy = "0.15.7"

# Database
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "chrono", "macros"] }
chrono = { version = "0.4.42", features = ["serde"] }

# API
utoipa = { version = "5.4.0", features = ["chrono", "actix_extras", "macros"] }
actix-web-httpauth = "0.8.2"
serde_json = "1.0.145"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
actix-cors = "0.7.1"
