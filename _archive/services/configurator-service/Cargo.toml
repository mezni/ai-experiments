[package]
name = "configurator-service"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Configurator Service Microservice (DDD, Actix Web, Postgres, OpenAPI)"
license = "MIT"

[dependencies]
actix-web = { version = "4.11.0", features = ["macros"] }
actix-cors = "0.7.1"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "uuid", "chrono"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
dotenv = "0.15.0"
async-trait = "0.1.89"
thiserror = "2.0.17"
anyhow = "1.0.100"
utoipa = { version = "5.4.0", features = ["uuid", "openapi_extensions"] }
utoipa-swagger-ui = "9.0.2"
actix-rt = "2.11.0"
