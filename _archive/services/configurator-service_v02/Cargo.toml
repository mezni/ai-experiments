[package]
name = "configurator-service"
version = "0.1.0"
edition = "2024"
authors = ["M.MEZNI <mamezni@gmail.com>"]
description = "configurator-service"
license = "MIT"

[dependencies]
# Actix Web
actix-web = "4.11.0"
actix-rt = "2.11.0"

# SQLx for Postgres
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }

# Async & Traits
async-trait = "0.1.68"

# Serde for JSON serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# OpenAPI / Swagger
utoipa =  "5.4.0"
utoipa-swagger-ui = "9.0.2"

# Tracing / logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }

# UUIDs
uuid = { version = "1.18.1", features = ["serde", "v4"] }

# Chrono for date/time
chrono = { version = "0.4.42", features = ["serde"] }

# Dotenv support
dotenvy = "0.15.7"

# Any other helpers
thiserror = "2.0.17"
anyhow = "1.0.100"
rand = "0.9.2"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["full"] }
