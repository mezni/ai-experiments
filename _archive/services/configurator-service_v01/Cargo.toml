[package]
name = "configurator-service"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
actix-web = "4.11.0"
tokio = { version = "1.48.0", features = ["full"] }
actix-cors = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] } 
actix-web-lab = "0.24.3"  
tracing = "0.1.41"  # Add this
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "chrono"] }
chrono = { version = "0.4.42", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
utoipa = { version = "5.4.0", features = ["chrono", "actix_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }
async-trait = "0.1.89"
serde_json = "1.0.145"
thiserror = "2.0.17"
