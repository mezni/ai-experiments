volumes:
  postgis_data:

networks:
  osm_network:

services:
  database-service:
    image: postgis/postgis:18-3.6
    container_name: database-service
    environment:
      POSTGRES_DB: ev_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql          # Persistent database data
      - ./initdb:/docker-entrypoint-initdb.d          # SQL scripts for initialization
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ev_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osm_network
