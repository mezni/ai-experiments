[project]
name = "02-rag-hybrid"
version = "0.1.0"
description = "Hybrid RAG pipeline: BM25 + dense vector retrieval with LLM generation"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.5",
    "httpx>=0.27",
    "langchain-text-splitters>=0.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
]

[project.scripts]
rag-hybrid = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
