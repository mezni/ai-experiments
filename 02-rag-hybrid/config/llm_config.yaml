embeddings:
  backend: openrouter
  model: openai/text-embedding-3-small
  openrouter_url: https://openrouter.ai/api/v1/embeddings
  batch_size: 64
  timeout_seconds: 120

models:
  - name: default
    provider: openrouter
    openrouter_url: https://openrouter.ai/api/v1/chat/completions
    model: openai/gpt-4o-mini
    max_tokens: 4096
    temperature: 0.3
    timeout_seconds: 120