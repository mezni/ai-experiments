[project]
name = "mcp-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_lab"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
