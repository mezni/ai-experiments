[package]
name = "locator-service"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.11.0"
actix-cors = "0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono", "bigdecimal"] }
tokio = { version = "1.48.0", features = ["full"] }
chrono = { version = "0.4.42", features = ["serde"] }
rust_decimal = "1.39.0"
env_logger = "0.11.8"
log = "0.4.28"
bigdecimal = "0.4.9"