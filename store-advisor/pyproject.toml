[project]
name = "store-advisor"
version = "0.1.0"
description = "LLM-powered store advisor API"
readme = "README.md"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
    "streamlit>=1.63.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
