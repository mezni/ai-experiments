llm:
  providers:
    openrouter:
      api_key_env: OPENROUTER_API_KEY
      base_url: https://openrouter.ai/api/v1
    openai:
      api_key_env: OPENAI_API_KEY
      base_url: https://api.openai.com/v1

  models:
    fast:
      provider: openrouter
      name: minimax/minimax-m3:free
      temperature: 0.3
      max_tokens: 2048
      timeout: 60
    smart:
      provider: openai
      name: gpt-4o
      temperature: 0.7
      max_tokens: 2048
      timeout: 120

  default_model: fast