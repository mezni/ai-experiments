# LLM Configuration
# Reused pattern from Bootcamp 3 (config/llm_config.yaml); extended with the RAG
# retrieval pipeline for the omni-connect knowledge base (data/knowledge_base/).
#
# Provider: configured for Anthropic via the anthropic SDK. To route through
# OpenRouter (https://openrouter.ai), set LLM_BASE_URL=https://openrouter.ai/api/v1
# in .env and use a key readable by src/llm (ANTHROPIC_API_KEY or
# OPENROUTER_API_KEY). Model names use OpenRouter's provider-namespaced
# format ("anthropic/claude-3.5-haiku").

provider:
  name: "anthropic"
  api_type: "anthropic"

models:
  # Primary chat LLM used for copilot rationale / conversational responses.
  chat:
    model_name: "anthropic/claude-3.5-haiku"
    temperature: 0.3
    max_tokens: 800
    top_p: 1.0
    frequency_penalty: 0.0
    presence_penalty: 0.0

  # Dense embedding model for RAG over data/knowledge_base. Runs locally via
  # sentence-transformers (no API cost): BAAI/bge-small-en-v1.5, 384 dims.
  embedding:
    model_name: "BAAI/bge-small-en-v1.5"
    dimensions: 384
    local: true
    device: "cpu"

  # Cross-Encoder reranker: re-scores the sparse/dense top-k candidates for
  # higher grounding precision. The smallest official BAAI reranker
  # (BAAI/bge-reranker-small does not exist; base is the closest fit).
  reranker:
    model_name: "BAAI/bge-reranker-base"
    local: true
    device: "cpu"

# LLM request behaviour - read by the LLM client and passed to the Anthropic SDK
api:
  timeout: 30
  max_retries: 3
  retry_delay: 1

# RAG retrieval pipeline over the Category B knowledge documents.
retrieval:
  method: "bm25+embedding+rerank"
  sparse_retriever:
    algorithm: "bm25"
    library: "rank_bm25"
    implementation: "BM25Okapi"
    top_k: 15
  dense_retriever:
    algorithm: "cosine_similarity"
    top_k: 15
  reranker:
    top_k: 8
  corpus:
    path: "data/knowledge_base"
    glob: "*.md.txt"

# Context & Safety Limits
safety:
  content_filter: true
  max_context_length: 200000 # Claude 3.5 Haiku supports up to 200k context window
  truncate_if_exceeds: true