[project]
name = "rag-indexer"
version = "0.1.0"
description = "Minimal RAG indexing and retrieval pipeline (FAISS + OpenRouter + MiniMax, pure Python)"
authors = [
    { name = "M.Mezni", email = "mamezni@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "numpy>=2.5.3",
    "openai>=3.9.0",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_sample_pdfs.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
