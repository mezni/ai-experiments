name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag_system
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_system"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://rag:rag_dev_password@localhost:5432/rag_system
      APP_ENV: test
      OPENROUTER_API_KEY: test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

      - name: Build production image
        run: docker build -t rag-system:ci .